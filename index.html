<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="AgriVision AI - Multi-Crop Plant Disease Detection and Farmer Assistance PWA based on 2025 IEEE Access research." />
    <title>AgriVision AI - Plant Disease Detection & Farmer Assistance</title>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clear legacy service worker registrations and stale caches to prevent blank white screens
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            if (name.includes('agrivision-v1')) {
              caches.delete(name);
            }
          }
        });
      }
    </script>
  </body>
</html>
